[build]
  # site/ se genera con: python3 build.py (y se sube al repo)
  command = ""
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# El service worker se revisa siempre: así cada publicación llega a los celus.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
